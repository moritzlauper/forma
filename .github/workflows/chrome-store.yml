name: Publish Chrome Web Store release
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    # Picks up the latest release after a previous Google review completes.
    - cron: '23 7 * * *'
permissions:
  contents: read
concurrency:
  group: chrome-web-store
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable vMAJOR.MINOR.PATCH release'; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:companion
      - name: Download and verify released extension
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "forma-$RELEASE_TAG.zip" --dir release
          unzip -p "release/forma-$RELEASE_TAG.zip" manifest.json > release-manifest.json
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("release-manifest.json")); const p=JSON.parse(fs.readFileSync("package.json")); if(m.version!==process.env.RELEASE_VERSION || p.version!==m.version) throw Error("Release version mismatch")'
          unzip -q "release/forma-$RELEASE_TAG.zip" -d released
          diff -r dist released
      - name: Submit when no other review is pending
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/chrome-store.mjs "release/forma-$RELEASE_TAG.zip" "$RELEASE_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
